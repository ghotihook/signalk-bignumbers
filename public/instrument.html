<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SignalK Instrument</title>
<style>
  @font-face {
    font-family: "Roboto Medium";
    src: url("fonts/Roboto-Medium.ttf") format("truetype");
    font-weight: 500;
    font-style: normal;
    font-display: block;
  }
  /* A theme is just these two colours -- everything muted derives from
     the foreground by opacity, so ?bg=/?fg= is all a theme needs to set. */
  :root {
    --bg: #000;
    --fg: #fff;
    /* Shared by the title and the unit so the two labels always match. */
    --label-size: clamp(1.6rem, 5vw, 4rem);
  }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    overflow: hidden;
    cursor: none;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    font-family: "Roboto Medium", ui-monospace, "SF Mono", Menlo, monospace;
    color: var(--fg);
    -webkit-font-smoothing: antialiased;
  }
  /* Taken out of body's flow rather than laid out inside it, so splitting
     the screen into bands leaves the centred message pane alone. */
  #cells {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
  }
  /* Labels are sized against the band they sit in: with two or three
     stacked, each band is shorter and a full-height label would crowd its
     number. One variable, so the title and unit shrink together. */
  #cells.n2 { --label-size: clamp(1.3rem, 3.4vw, 2.6rem); }
  #cells.n3 { --label-size: clamp(1.1rem, 2.6vw, 2rem); }
  .cell {
    flex: 1;
    min-height: 0;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .cell + .cell::before {
    content: "";
    position: absolute;
    top: 0;
    left: 5%;
    right: 5%;
    height: 1px;
    background: currentColor;
    opacity: 0.15;
  }
  .title {
    /* Absolute, not fixed: it belongs to its band. With a single value the
       band is the whole viewport, so it lands exactly where it always has. */
    position: absolute;
    top: 1.2rem;
    left: 1.2rem;
    font-size: var(--label-size);
    font-weight: 500;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    opacity: 0.6;
  }
  .value-row {
    display: flex;
    align-items: baseline;
    font-size: 10rem; /* overwritten by fitDisplay() once the page has real dimensions */
  }
  .sign, .value {
    font-size: 1em;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
    line-height: 1;
    white-space: pre;
    -webkit-text-stroke: 0.008em currentColor;
    transition: none;
  }
  .sign {
    display: inline-block;
    width: 0.6em;
    text-align: center;
  }
  .sign:empty {
    width: 0;
  }
  .sign.stale, .value.stale {
    opacity: 0.3;
  }
  .ghost {
    visibility: hidden;
  }
  .unit {
    /* Absolute rather than an em of the value row, so it tracks the title
       instead of growing with the number. fitDisplay() still converges:
       the unit is then a constant width in the row it measures. */
    font-size: var(--label-size);
    font-weight: 500;
    opacity: 0.6;
    margin-left: 0.4em;
  }
  .error {
    font-size: clamp(1.2rem, 3vw, 2rem);
    color: #d55;
    max-width: 80vw;
    text-align: center;
  }
  .unconfigured {
    text-align: center;
  }
  .unconfigured .id {
    /* The code is the Pi's hostname, so this has to stay readable for
       anything from "rpiz" to "raspberrypi" -- wrap rather than clip. */
    font-size: clamp(2.5rem, 15vw, 8rem);
    font-weight: 500;
    letter-spacing: 0.05em;
    max-width: 92vw;
    overflow-wrap: anywhere;
  }
  .unconfigured .hint {
    font-size: clamp(1rem, 2.5vw, 1.5rem);
    opacity: 0.6;
    margin-top: 1rem;
  }
  #statusDot {
    position: fixed;
    top: 1.2rem;
    right: 1.2rem;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #500;
  }
  #statusDot.live {
    background: #0a0;
  }
  /* #cells and .value-row set display:flex, so plain [hidden] wouldn't win */
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <div id="statusDot"></div>
  <div id="cells" hidden></div>
  <!-- Error / "not configured yet" content lives here rather than being
       written into a cell, so the sign/value/unit elements are never
       destroyed and their references stay valid for the life of the page. -->
  <div id="message" hidden></div>

<script>
  // --- Instrument configuration ---
  // A display shows one, two or three values, stacked in equal bands.
  // Config is either read entirely from the URL query string:
  //   ?path=environment.wind.speedApparent&name=AWS&layout=xx.xx&unit=kt&factor=1.9438444924406
  //   ?path=navigation.attitude&field=roll&name=Heel&layout=xx&neg=true&unit=%C2%B0&factor=57.29577951308232
  //   ?path=environment.water.temperature&name=SEA&layout=xx.x&unit=%C2%B0C&factor=1&offset=-273.15
  // ...with a second and third value's keys suffixed 2 and 3, so every
  // single-value URL that ever worked still means the same thing:
  //   ?path=navigation.speedOverGround&name=SOG&layout=xx.x&unit=kt&path2=environment.depth.belowTransducer&name2=DPT&layout2=xx.x&unit2=m
  // ...or, for a "dumb" display that never needs its own config touched,
  // just an identifier -- usually the Pi's hostname, via systemd's %H --
  // and the real config is fetched from SignalK itself:
  //   ?display=helm
  const params = new URLSearchParams(window.location.search);
  const displayId = params.get("display");

  const MAX_ITEMS = 3;
  // The per-value keys, as they appear both in a stored config and (with
  // the 2/3 suffix for the second and third value) in the query string.
  const ITEM_KEYS = ["path", "field", "name", "factor", "offset", "unit", "layout", "neg"];

  function num(v, fallback) {
    const n = parseFloat(v);
    return Number.isFinite(n) ? n : fallback;
  }

  // Normalises one raw value config into the shape the rest of the page
  // uses. Raw values arrive either as query-string strings or as whatever
  // JSON types the store holds, so everything here is coerced, not trusted.
  function makeItem(raw) {
    const [intPart, decPart] = String(raw.layout || "x").split(".");
    return {
      path: raw.path || null,       // SignalK path to subscribe to
      field: raw.field || null,     // key to pull out of a compound object value
      name: raw.name || null,       // short label above the number
      factor: num(raw.factor, 1),   // unit conversion multiplier
      offset: num(raw.offset, 0),   // unit conversion offset (e.g. Kelvin -> Celsius)
      unit: raw.unit || "",         // unit label after the number
      expectNegative: raw.neg === true || raw.neg === "true", // reserve a sign column?
      intDigits: intPart.length,    // "xx.x" -> 2 integer digits, 1 decimal
      decimals: decPart ? decPart.length : 0,
    };
  }

  // Values are read positionally: the suffix-free keys are the first, then
  // 2 and 3. A missing path ends the list, so there are never gaps.
  function itemsFromParams(p) {
    const items = [];
    for (let i = 0; i < MAX_ITEMS; i++) {
      const suffix = i === 0 ? "" : String(i + 1);
      if (!p.get("path" + suffix)) break;
      const raw = {};
      for (const key of ITEM_KEYS) raw[key] = p.get(key + suffix);
      items.push(raw);
    }
    return items;
  }

  let CONFIG = {
    // Defaults to the host that served this page -- once installed as a
    // SignalK webapp that's always the right SignalK server. Override
    // with ?host= to point at a different server (e.g. a test instance).
    host: params.get("host") || window.location.host,
    bg: params.get("bg") || null, // theme background, e.g. #000000
    fg: params.get("fg") || null, // theme foreground, e.g. #ffffff
    staleMs: 3000,                // grey out (and reset to placeholder) if no update within this window
    reconnectMs: 1000,            // delay before retrying a dropped connection
    items: itemsFromParams(params).map(makeItem),
  };

  const cellsEl = document.getElementById("cells");
  const dotEl = document.getElementById("statusDot");
  const messageEl = document.getElementById("message");

  // One entry per displayed value, built once by buildCells(). Each holds
  // its own element references and its own stale timer.
  let cells = [];

  // Swaps between the live cells and the message pane. Neither is ever
  // rebuilt, so a display can move between "not configured", an error and
  // running any number of times without invalidating element references.
  function showMessage(node) {
    messageEl.textContent = "";
    messageEl.appendChild(node);
    messageEl.hidden = false;
    cellsEl.hidden = true;
  }

  function showError(message) {
    document.title = "SignalK Instrument — error";
    const box = document.createElement("div");
    box.className = "error";
    box.textContent = message;
    showMessage(box);
  }

  // Shown when a display has no saved config yet -- the normal state for
  // a freshly set-up kiosk. Puts the identifier front and centre so
  // whoever's looking at the physical screen can read it off and enter it
  // in the webapp, no SSH access needed.
  function showUnconfigured() {
    document.title = `Unconfigured — ${displayId}`;
    const box = document.createElement("div");
    box.className = "unconfigured";
    const id = document.createElement("div");
    id.className = "id";
    id.textContent = displayId;
    const hint = document.createElement("div");
    hint.className = "hint";
    hint.textContent = "Not configured yet — add this hostname in the SignalK Displays webapp";
    box.append(id, hint);
    showMessage(box);
  }

  // Runs exactly once, from start(). Nothing here is ever rebuilt
  // afterwards -- only the text inside .sign and .value changes. Recreating
  // a cell would detach the references captured below, and every later
  // update would silently write to orphaned nodes.
  function buildCells() {
    cellsEl.className = `n${CONFIG.items.length}`;
    cells = CONFIG.items.map((cfg) => {
      const el = document.createElement("div");
      el.className = "cell";
      const titleEl = document.createElement("div");
      titleEl.className = "title";
      titleEl.textContent = cfg.name;
      const rowEl = document.createElement("div");
      rowEl.className = "value-row";
      const signEl = document.createElement("span");
      signEl.className = "sign";
      const valueEl = document.createElement("span");
      valueEl.className = "value";
      const unitEl = document.createElement("span");
      unitEl.className = "unit";
      unitEl.textContent = cfg.unit;
      // Appended as elements, never via innerHTML: .value is white-space:pre,
      // so whitespace between the tags would render as a real space.
      rowEl.append(signEl, valueEl, unitEl);
      el.append(titleEl, rowEl);
      cellsEl.appendChild(el);
      return {
        cfg, el, rowEl, signEl, valueEl,
        staleTimer: null,
        placeholderSign: cfg.expectNegative ? " " : "",
        placeholderValue: "-".repeat(cfg.intDigits) +
          (cfg.decimals > 0 ? "." + "-".repeat(cfg.decimals) : ""),
      };
    });
  }

  // Like run(), at most once per page load -- it builds the cells. Config
  // changes are handled by reloading the page, not by calling this again.
  function start() {
    if (!CONFIG.items.length || CONFIG.items.some((item) => !item.path || !item.name)) {
      showError("Missing required ?path= and/or ?name= parameter");
      return;
    }
    document.title = CONFIG.items.map((item) => item.name).join(" · ");
    if (CONFIG.bg) document.documentElement.style.setProperty("--bg", CONFIG.bg);
    if (CONFIG.fg) document.documentElement.style.setProperty("--fg", CONFIG.fg);
    buildCells();
    messageEl.hidden = true;
    cellsEl.hidden = false;
    run();
  }

  // Fetches this display's config from the store the webapp saves to,
  // keyed by identifier. A missing config is the normal state for a
  // freshly set-up display, so that case polls (showing the id) rather
  // than giving up -- it picks the config up as soon as it's saved, with
  // no restart needed. A genuine network/server problem still gives up
  // after a handful of quick retries and shows an error instead.
  const POLL_MS = 5000;

  function configUrl() {
    const proto = window.location.protocol === "https:" ? "https:" : "http:";
    return `${proto}//${CONFIG.host}/signalk/v1/applicationData/global/signalk-bignumbers/1`;
  }

  function fetchDisplayConfig(attempt) {
    // Two-argument then(), not then().catch() -- the failure handler must
    // see fetch/parse errors only. Catching errors thrown by the success
    // handler too would retry it, starting a second websocket.
    fetch(configUrl())
      .then((r) => (r.ok ? r.json() : {}))
      .then((data) => {
        const raw = data[displayId];
        if (!raw) {
          showUnconfigured();
          setTimeout(() => fetchDisplayConfig(0), POLL_MS);
          return;
        }
        // host isn't part of a stored config -- keep the one we're already
        // talking to, or a ?host= override would be silently dropped here
        // and the websocket would connect somewhere else.
        // A config saved before multi-value support is a bare single value
        // with no items array; read it as a one-value config.
        CONFIG = {
          ...CONFIG,
          bg: raw.bg || null,
          fg: raw.fg || null,
          items: (Array.isArray(raw.items) ? raw.items : [raw]).slice(0, MAX_ITEMS).map(makeItem),
        };
        start();
        watchForConfigChanges(JSON.stringify(raw));
      }, () => {
        if (attempt < 5) {
          setTimeout(() => fetchDisplayConfig(attempt + 1), CONFIG.reconnectMs);
        } else {
          showError(`Can't reach SignalK at ${CONFIG.host}`);
        }
      });
  }

  // Keep watching the stored config once running, so a change made in the
  // picker takes effect on its own with no restart. Reloading re-runs the
  // whole load path, which covers every case for free -- including the
  // config being deleted, which lands back on the "show my code" screen.
  // A failed poll is ignored: only a genuinely different config reloads,
  // so a network blip can't cause a reload loop.
  function watchForConfigChanges(loadedJson) {
    setInterval(() => {
      fetch(configUrl())
        .then((r) => (r.ok ? r.json() : {}))
        .then((data) => {
          if (JSON.stringify(data[displayId] || null) !== loadedJson) window.location.reload();
        }, () => {});
    }, POLL_MS);
  }

  if (displayId) {
    fetchDisplayConfig(0);
  } else {
    start();
  }

  // Measure with real digit glyphs, not the placeholder's dashes -- a
  // proportional font's "-" isn't guaranteed the same width as its digits,
  // so fitting against dashes could leave live numbers over- or under-sized.
  // Every cell ends up at the same size, set by whichever one fits tightest
  // in its own band, so a screen of numbers reads as one instrument rather
  // than as several unrelated ones.
  function fitDisplay() {
    const saved = cells.map((c) => ({ html: c.valueEl.innerHTML, sign: c.signEl.textContent }));
    for (const c of cells) {
      const intSample = "8".repeat(c.cfg.intDigits);
      c.valueEl.textContent = c.cfg.decimals > 0
        ? `${intSample}.${"8".repeat(c.cfg.decimals)}`
        : intSample;
      c.signEl.textContent = c.cfg.expectNegative ? "-" : "";
      c.rowEl.style.fontSize = "10rem";
    }

    // A single measure-and-scale jump from a small baseline to a much larger
    // target isn't perfectly accurate (subpixel rounding/hinting mean font
    // metrics don't scale perfectly linearly across a big range), so refine
    // over a few passes -- each one is a much smaller correction than the
    // last and converges on the true fit.
    for (let i = 0; i < 4; i++) {
      let scale = Infinity;
      for (const c of cells) {
        const rect = c.rowEl.getBoundingClientRect();
        if (rect.width <= 0 || rect.height <= 0) { scale = Infinity; break; }
        scale = Math.min(scale,
          (c.el.clientWidth * 0.92) / rect.width,
          (c.el.clientHeight * 0.85) / rect.height);
      }
      if (!Number.isFinite(scale)) break;
      // Every row is at the same size, so one read gives the base for all.
      const baseSizePx = parseFloat(getComputedStyle(cells[0].rowEl).fontSize);
      for (const c of cells) c.rowEl.style.fontSize = `${baseSizePx * scale}px`;
    }

    cells.forEach((c, i) => {
      c.valueEl.innerHTML = saved[i].html;
      c.signEl.textContent = saved[i].sign;
    });
  }

  function run() {
    for (const c of cells) {
      c.signEl.textContent = c.placeholderSign;
      c.valueEl.textContent = c.placeholderValue;
    }

    fitDisplay();
    document.fonts.ready.then(fitDisplay);
    window.addEventListener("resize", () => requestAnimationFrame(fitDisplay));

    function formatValue(cfg, v) {
      const scaled = v * cfg.factor + cfg.offset;
      const absStr = Math.abs(scaled).toFixed(cfg.decimals);
      const [intPart, decPart] = absStr.split(".");
      const roundsToZero = parseFloat(absStr) === 0;
      const sign = !cfg.expectNegative ? "" : (roundsToZero || scaled >= 0 ? " " : "-");
      return { sign, intPart: intPart.padStart(cfg.intDigits, "0"), decPart };
    }

    // Leading zeros in the integer part stay in the DOM (so they still occupy
    // their digit's exact width) but are rendered invisible, always leaving at
    // least one integer digit visible.
    function digitsHtml(intPart, decPart) {
      const chars = intPart.split("");
      const firstSignificant = chars.findIndex((c) => c !== "0");
      const cut = firstSignificant === -1 ? chars.length - 1 : firstSignificant;
      const intHtml = chars
        .map((c, i) => (i < cut ? `<span class="ghost">${c}</span>` : c))
        .join("");
      return decPart !== undefined ? `${intHtml}.${decPart}` : intHtml;
    }

    function markStale(c) {
      c.signEl.textContent = c.placeholderSign;
      c.valueEl.textContent = c.placeholderValue;
      c.signEl.classList.add("stale");
      c.valueEl.classList.add("stale");
    }

    function updateValue(c, v) {
      const { sign, intPart, decPart } = formatValue(c.cfg, v);
      c.signEl.textContent = sign;
      c.valueEl.innerHTML = digitsHtml(intPart, decPart);
      c.signEl.classList.remove("stale");
      c.valueEl.classList.remove("stale");
      clearTimeout(c.staleTimer);
      c.staleTimer = setTimeout(() => markStale(c), CONFIG.staleMs);
    }

    // Two values can share a path -- heel and trim are both fields of
    // navigation.attitude -- so subscribe once per distinct path and fan
    // each delta out to every cell watching it.
    const byPath = new Map();
    for (const c of cells) {
      if (!byPath.has(c.cfg.path)) byPath.set(c.cfg.path, []);
      byPath.get(c.cfg.path).push(c);
    }

    function connect() {
      // Match the page's own protocol -- if this webapp is served over
      // https, the SignalK stream must be wss:// or the browser blocks it
      // as mixed content.
      const wsProtocol = window.location.protocol === "https:" ? "wss:" : "ws:";
      const ws = new WebSocket(`${wsProtocol}//${CONFIG.host}/signalk/v1/stream?subscribe=none`);

      ws.onopen = () => {
        dotEl.classList.add("live");
        ws.send(JSON.stringify({
          context: "vessels.self",
          subscribe: [...byPath.keys()].map((path) => ({ path, policy: "instant" })),
        }));
      };

      ws.onmessage = (evt) => {
        const data = JSON.parse(evt.data);
        if (!data.updates) return;
        for (const update of data.updates) {
          if (!update.values) continue;
          for (const v of update.values) {
            for (const c of byPath.get(v.path) || []) {
              // v.value can be null when a source drops out, so don't index
              // into it blindly -- that would throw and kill this handler.
              const raw = c.cfg.field ? v.value && v.value[c.cfg.field] : v.value;
              if (typeof raw === "number") updateValue(c, raw);
            }
          }
        }
      };

      ws.onclose = () => {
        dotEl.classList.remove("live");
        for (const c of cells) markStale(c);
        setTimeout(connect, CONFIG.reconnectMs);
      };

      ws.onerror = () => ws.close();
    }

    connect();
  }
</script>
</body>
</html>
