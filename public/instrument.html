<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SignalK Instrument</title>
<style>
  @font-face {
    font-family: "Roboto Medium";
    src: url("fonts/Roboto-Medium.ttf") format("truetype");
    font-weight: 500;
    font-style: normal;
    font-display: block;
  }
  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    overflow: hidden;
    cursor: none;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    font-family: "Roboto Medium", ui-monospace, "SF Mono", Menlo, monospace;
    color: #fff;
    -webkit-font-smoothing: antialiased;
  }
  .title {
    position: fixed;
    top: 1.2rem;
    left: 1.2rem;
    font-size: clamp(1rem, 2.5vw, 1.8rem);
    font-weight: 500;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #999;
  }
  .value-row {
    display: flex;
    align-items: baseline;
    font-size: 10rem; /* overwritten by fitDisplay() once the page has real dimensions */
  }
  .sign, .value {
    font-size: 1em;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
    line-height: 1;
    white-space: pre;
    -webkit-text-stroke: 0.008em currentColor;
    transition: none;
  }
  .sign {
    display: inline-block;
    width: 0.6em;
    text-align: center;
  }
  .sign:empty {
    width: 0;
  }
  .sign.stale, .value.stale {
    color: #555;
  }
  .ghost {
    visibility: hidden;
  }
  .unit {
    font-size: 0.15em;
    font-weight: 500;
    color: #999;
    margin-left: 0.4em;
  }
  .error {
    font-size: clamp(1.2rem, 3vw, 2rem);
    color: #d55;
    max-width: 80vw;
    text-align: center;
  }
  .unconfigured {
    text-align: center;
  }
  .unconfigured .id {
    font-size: clamp(3rem, 18vw, 9rem);
    font-weight: 500;
    letter-spacing: 0.1em;
    font-variant-numeric: tabular-nums;
  }
  .unconfigured .hint {
    font-size: clamp(1rem, 2.5vw, 1.5rem);
    color: #999;
    margin-top: 1rem;
  }
  #statusDot {
    position: fixed;
    top: 1.2rem;
    right: 1.2rem;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #500;
  }
  #statusDot.live {
    background: #0a0;
  }
  /* .value-row sets display:flex, so plain [hidden] wouldn't win */
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <div id="statusDot"></div>
  <div class="title" id="title"></div>
  <div class="value-row" id="valueRow">
    <span class="sign" id="sign"></span><span class="value" id="value"></span>
    <span class="unit" id="unit"></span>
  </div>
  <!-- Error / "not configured yet" content lives here rather than being
       written into the value row, so the sign/value/unit elements are
       never destroyed and their references stay valid for the life of
       the page. -->
  <div id="message" hidden></div>

<script>
  // --- Instrument configuration ---
  // Either read entirely from the URL query string:
  //   ?path=environment.wind.speedApparent&name=AWS&layout=xx.xx&unit=kt&factor=1.9438444924406
  //   ?path=navigation.attitude&field=roll&name=Heel&layout=xx&neg=true&unit=%C2%B0&factor=57.29577951308232
  //   ?path=environment.water.temperature&name=SEA&layout=xx.x&unit=%C2%B0C&factor=1&offset=-273.15
  // ...or, for a "dumb" display that never needs its own config touched,
  // just a display code -- the real config is fetched from SignalK itself:
  //   ?display=f3a9
  const params = new URLSearchParams(window.location.search);
  const displayId = params.get("display");

  function parseLayout(layout) {
    const [intPart, decPart] = layout.split(".");
    return { intDigits: intPart.length, decimals: decPart ? decPart.length : 0 };
  }

  // Builds CONFIG from anything with URLSearchParams' get()/has() shape --
  // used directly for the query-string case, and via a tiny adapter (see
  // fetchDisplayConfig) for config fetched from SignalK's applicationData.
  function buildConfig(p) {
    return {
      // Defaults to the host that served this page -- once installed as a
      // SignalK webapp that's always the right SignalK server. Override
      // with ?host= to point at a different server (e.g. a test instance).
      host: p.get("host") || window.location.host,
      path: p.get("path"),                          // SignalK path to subscribe to
      field: p.get("field") || null,                 // key to pull out of a compound object value
      name: p.get("name"),                           // short label + browser tab title
      factor: p.has("factor") ? parseFloat(p.get("factor")) : 1, // unit conversion multiplier
      offset: p.has("offset") ? parseFloat(p.get("offset")) : 0, // unit conversion offset (e.g. Kelvin -> Celsius)
      unit: p.get("unit") || "",                     // unit label after the number
      expectNegative: p.get("neg") === "true",       // reserve a sign column?
      staleMs: 3000,                // grey out (and reset to placeholder) if no update within this window
      reconnectMs: 1000,            // delay before retrying a dropped connection
      ...parseLayout(p.get("layout") || "x"),
    };
  }

  let CONFIG = buildConfig(params);

  const titleEl = document.getElementById("title");
  const valueRowEl = document.getElementById("valueRow");
  const signEl = document.getElementById("sign");
  const valueEl = document.getElementById("value");
  const unitEl = document.getElementById("unit");
  const dotEl = document.getElementById("statusDot");
  const messageEl = document.getElementById("message");
  let staleTimer = null;

  // Swaps between the live value row and the message pane. Neither is
  // ever rebuilt, so a display can move between "not configured", an
  // error and running any number of times without invalidating the
  // element references captured above.
  function showMessage(node) {
    messageEl.textContent = "";
    messageEl.appendChild(node);
    messageEl.hidden = false;
    valueRowEl.hidden = true;
  }

  function showError(message) {
    document.title = "SignalK Instrument — error";
    titleEl.textContent = "ERROR";
    const box = document.createElement("div");
    box.className = "error";
    box.textContent = message;
    showMessage(box);
  }

  // Shown when a display id has no saved config yet -- the normal state
  // for a freshly set-up kiosk. Puts the id itself front and center so
  // whoever's looking at the physical screen can read it off and hand it
  // to the picker page, no SSH access needed.
  function showUnconfigured() {
    document.title = `Unconfigured — ${displayId}`;
    titleEl.textContent = "";
    const box = document.createElement("div");
    box.className = "unconfigured";
    const id = document.createElement("div");
    id.className = "id";
    id.textContent = displayId;
    const hint = document.createElement("div");
    hint.className = "hint";
    hint.textContent = "Not configured yet — add this code in the SignalK displays webapp";
    box.append(id, hint);
    showMessage(box);
  }

  function start() {
    if (!CONFIG.path || !CONFIG.name) {
      showError("Missing required ?path= and/or ?name= parameter");
      return;
    }
    document.title = CONFIG.name;
    titleEl.textContent = CONFIG.name;
    unitEl.textContent = CONFIG.unit;
    messageEl.hidden = true;
    valueRowEl.hidden = false;
    run();
  }

  // Fetches this display's config from the store the webapp saves to,
  // keyed by display code. A missing config is the normal state for a
  // freshly set-up display, so that case polls (showing the code) rather
  // than giving up -- it picks the config up as soon as it's saved, with
  // no restart needed. A genuine network/server problem still gives up
  // after a handful of quick retries and shows an error instead.
  const POLL_MS = 5000;

  function configUrl() {
    const proto = window.location.protocol === "https:" ? "https:" : "http:";
    return `${proto}//${CONFIG.host}/signalk/v1/applicationData/global/signalk-bignumbers/1`;
  }

  function fetchDisplayConfig(attempt) {
    // Two-argument then(), not then().catch() -- the failure handler must
    // see fetch/parse errors only. Catching errors thrown by the success
    // handler too would retry it, starting a second websocket.
    fetch(configUrl())
      .then((r) => (r.ok ? r.json() : {}))
      .then((data) => {
        const raw = data[displayId];
        if (!raw) {
          showUnconfigured();
          setTimeout(() => fetchDisplayConfig(0), POLL_MS);
          return;
        }
        const getter = {
          get: (k) => (raw[k] === undefined || raw[k] === null ? null : String(raw[k])),
          has: (k) => raw[k] !== undefined && raw[k] !== null,
        };
        CONFIG = buildConfig(getter);
        start();
        watchForConfigChanges(JSON.stringify(raw));
      }, () => {
        if (attempt < 5) {
          setTimeout(() => fetchDisplayConfig(attempt + 1), CONFIG.reconnectMs);
        } else {
          showError(`Can't reach SignalK at ${CONFIG.host}`);
        }
      });
  }

  // Keep watching the stored config once running, so a change made in the
  // picker takes effect on its own with no restart. Reloading re-runs the
  // whole load path, which covers every case for free -- including the
  // config being deleted, which lands back on the "show my code" screen.
  // A failed poll is ignored: only a genuinely different config reloads,
  // so a network blip can't cause a reload loop.
  function watchForConfigChanges(loadedJson) {
    setInterval(() => {
      fetch(configUrl())
        .then((r) => (r.ok ? r.json() : {}))
        .then((data) => {
          if (JSON.stringify(data[displayId] || null) !== loadedJson) window.location.reload();
        }, () => {});
    }, POLL_MS);
  }

  if (displayId) {
    fetchDisplayConfig(0);
  } else {
    start();
  }

  // Measure with real digit glyphs, not the placeholder's dashes -- a
  // proportional font's "-" isn't guaranteed the same width as its digits,
  // so fitting against dashes could leave live numbers over- or under-sized.
  function fitDisplay() {
    const sampleIntPart = "8".repeat(CONFIG.intDigits);
    const sampleDecPart = CONFIG.decimals > 0 ? "8".repeat(CONFIG.decimals) : undefined;
    const prevValueHtml = valueEl.innerHTML;
    const prevSignText = signEl.textContent;
    valueEl.textContent = sampleDecPart !== undefined ? `${sampleIntPart}.${sampleDecPart}` : sampleIntPart;
    signEl.textContent = CONFIG.expectNegative ? "-" : "";

    // A single measure-and-scale jump from a small baseline to a much larger
    // target isn't perfectly accurate (subpixel rounding/hinting mean font
    // metrics don't scale perfectly linearly across a big range), so refine
    // over a few passes -- each one is a much smaller correction than the
    // last and converges on the true fit.
    const availW = window.innerWidth * 0.92;
    const availH = window.innerHeight * 0.85;
    valueRowEl.style.fontSize = "10rem";
    for (let i = 0; i < 4; i++) {
      const rect = valueRowEl.getBoundingClientRect();
      if (rect.width <= 0 || rect.height <= 0) break;
      const baseSizePx = parseFloat(getComputedStyle(valueRowEl).fontSize);
      const scale = Math.min(availW / rect.width, availH / rect.height);
      valueRowEl.style.fontSize = `${baseSizePx * scale}px`;
    }

    valueEl.innerHTML = prevValueHtml;
    signEl.textContent = prevSignText;
  }

  function run() {
    const PLACEHOLDER_SIGN = CONFIG.expectNegative ? " " : "";
    const PLACEHOLDER_VALUE = "-".repeat(CONFIG.intDigits) +
      (CONFIG.decimals > 0 ? "." + "-".repeat(CONFIG.decimals) : "");
    signEl.textContent = PLACEHOLDER_SIGN;
    valueEl.textContent = PLACEHOLDER_VALUE;

    fitDisplay();
    document.fonts.ready.then(fitDisplay);
    window.addEventListener("resize", () => requestAnimationFrame(fitDisplay));

    function formatValue(v) {
      const scaled = v * CONFIG.factor + CONFIG.offset;
      const absStr = Math.abs(scaled).toFixed(CONFIG.decimals);
      const [intPart, decPart] = absStr.split(".");
      const roundsToZero = parseFloat(absStr) === 0;
      const sign = !CONFIG.expectNegative ? "" : (roundsToZero || scaled >= 0 ? " " : "-");
      return { sign, intPart: intPart.padStart(CONFIG.intDigits, "0"), decPart };
    }

    // Leading zeros in the integer part stay in the DOM (so they still occupy
    // their digit's exact width) but are rendered invisible, always leaving at
    // least one integer digit visible.
    function digitsHtml(intPart, decPart) {
      const chars = intPart.split("");
      const firstSignificant = chars.findIndex((c) => c !== "0");
      const cut = firstSignificant === -1 ? chars.length - 1 : firstSignificant;
      const intHtml = chars
        .map((c, i) => (i < cut ? `<span class="ghost">${c}</span>` : c))
        .join("");
      return decPart !== undefined ? `${intHtml}.${decPart}` : intHtml;
    }

    function markStale() {
      signEl.textContent = PLACEHOLDER_SIGN;
      valueEl.textContent = PLACEHOLDER_VALUE;
      signEl.classList.add("stale");
      valueEl.classList.add("stale");
    }

    function updateValue(v) {
      const { sign, intPart, decPart } = formatValue(v);
      signEl.textContent = sign;
      valueEl.innerHTML = digitsHtml(intPart, decPart);
      signEl.classList.remove("stale");
      valueEl.classList.remove("stale");
      clearTimeout(staleTimer);
      staleTimer = setTimeout(markStale, CONFIG.staleMs);
    }

    function connect() {
      // Match the page's own protocol -- if this webapp is served over
      // https, the SignalK stream must be wss:// or the browser blocks it
      // as mixed content.
      const wsProtocol = window.location.protocol === "https:" ? "wss:" : "ws:";
      const ws = new WebSocket(`${wsProtocol}//${CONFIG.host}/signalk/v1/stream?subscribe=none`);

      ws.onopen = () => {
        dotEl.classList.add("live");
        ws.send(JSON.stringify({
          context: "vessels.self",
          subscribe: [{ path: CONFIG.path, policy: "instant" }],
        }));
      };

      ws.onmessage = (evt) => {
        const data = JSON.parse(evt.data);
        if (!data.updates) return;
        for (const update of data.updates) {
          if (!update.values) continue;
          for (const v of update.values) {
            if (v.path !== CONFIG.path) continue;
            const raw = CONFIG.field ? v.value[CONFIG.field] : v.value;
            if (raw !== null && raw !== undefined) updateValue(raw);
          }
        }
      };

      ws.onclose = () => {
        dotEl.classList.remove("live");
        markStale();
        setTimeout(connect, CONFIG.reconnectMs);
      };

      ws.onerror = () => ws.close();
    }

    connect();
  }
</script>
</body>
</html>
