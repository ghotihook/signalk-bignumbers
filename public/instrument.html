<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SignalK Instrument</title>
<style>
  @font-face {
    font-family: "Roboto Medium";
    src: url("fonts/Roboto-Medium.ttf") format("truetype");
    font-weight: 500;
    font-style: normal;
    font-display: block;
  }
  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    overflow: hidden;
    cursor: none;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    font-family: "Roboto Medium", ui-monospace, "SF Mono", Menlo, monospace;
    color: #fff;
    -webkit-font-smoothing: antialiased;
  }
  .title {
    position: fixed;
    top: 1.2rem;
    left: 1.2rem;
    font-size: clamp(1rem, 2.5vw, 1.8rem);
    font-weight: 500;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #999;
  }
  .value-row {
    display: flex;
    align-items: baseline;
    font-size: 10rem; /* overwritten by fitDisplay() once the page has real dimensions */
  }
  .sign, .value {
    font-size: 1em;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
    line-height: 1;
    white-space: pre;
    -webkit-text-stroke: 0.008em currentColor;
    transition: none;
  }
  .sign {
    display: inline-block;
    width: 0.6em;
    text-align: center;
  }
  .sign:empty {
    width: 0;
  }
  .sign.stale, .value.stale {
    color: #555;
  }
  .ghost {
    visibility: hidden;
  }
  .unit {
    font-size: 0.15em;
    font-weight: 500;
    color: #999;
    margin-left: 0.4em;
  }
  .error {
    font-size: clamp(1.2rem, 3vw, 2rem);
    color: #d55;
    max-width: 80vw;
    text-align: center;
  }
  #statusDot {
    position: fixed;
    top: 1.2rem;
    right: 1.2rem;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #500;
  }
  #statusDot.live {
    background: #0a0;
  }
</style>
</head>
<body>
  <div id="statusDot"></div>
  <div class="title" id="title"></div>
  <div class="value-row" id="valueRow">
    <span class="sign" id="sign"></span><span class="value" id="value"></span>
    <span class="unit" id="unit"></span>
  </div>

<script>
  // --- Instrument configuration, read entirely from the URL query string ---
  // ?path=environment.wind.speedApparent&name=AWS&layout=xx.xx&unit=kt&factor=1.9438444924406
  // ?path=navigation.attitude&field=roll&name=Heel&layout=xx&neg=true&unit=%C2%B0&factor=57.29577951308232
  // ?path=environment.water.temperature&name=SEA&layout=xx.x&unit=%C2%B0C&factor=1&offset=-273.15
  const params = new URLSearchParams(window.location.search);

  function parseLayout(layout) {
    const [intPart, decPart] = layout.split(".");
    return { intDigits: intPart.length, decimals: decPart ? decPart.length : 0 };
  }

  const CONFIG = {
    // Defaults to the host that served this page -- once installed as a
    // SignalK webapp that's always the right SignalK server. Override with
    // ?host= to point at a different server (e.g. a local test instance).
    host: params.get("host") || window.location.host || "hl.local:3000",
    path: params.get("path"),                          // SignalK path to subscribe to
    field: params.get("field") || null,                 // key to pull out of a compound object value
    name: params.get("name"),                           // short label + browser tab title
    factor: params.has("factor") ? parseFloat(params.get("factor")) : 1, // unit conversion multiplier
    offset: params.has("offset") ? parseFloat(params.get("offset")) : 0, // unit conversion offset (e.g. Kelvin -> Celsius)
    unit: params.get("unit") || "",                     // unit label after the number
    expectNegative: params.get("neg") === "true",       // reserve a sign column?
    staleMs: 3000,                // grey out (and reset to placeholder) if no update within this window
    reconnectMs: 1000,            // delay before retrying a dropped connection
    ...parseLayout(params.get("layout") || "x"),
  };

  const titleEl = document.getElementById("title");
  const valueRowEl = document.getElementById("valueRow");
  const signEl = document.getElementById("sign");
  const valueEl = document.getElementById("value");
  const unitEl = document.getElementById("unit");
  const dotEl = document.getElementById("statusDot");
  let staleTimer = null;

  if (!CONFIG.path || !CONFIG.name) {
    document.title = "SignalK Instrument — error";
    titleEl.textContent = "ERROR";
    valueRowEl.innerHTML = '<span class="error">Missing required ?path= and/or ?name= parameter</span>';
  } else {
    document.title = CONFIG.name;
    titleEl.textContent = CONFIG.name;
    unitEl.textContent = CONFIG.unit;
    run();
  }

  // Measure with real digit glyphs, not the placeholder's dashes -- a
  // proportional font's "-" isn't guaranteed the same width as its digits,
  // so fitting against dashes could leave live numbers over- or under-sized.
  function fitDisplay() {
    const sampleIntPart = "8".repeat(CONFIG.intDigits);
    const sampleDecPart = CONFIG.decimals > 0 ? "8".repeat(CONFIG.decimals) : undefined;
    const prevValueHtml = valueEl.innerHTML;
    const prevSignText = signEl.textContent;
    valueEl.textContent = sampleDecPart !== undefined ? `${sampleIntPart}.${sampleDecPart}` : sampleIntPart;
    signEl.textContent = CONFIG.expectNegative ? "-" : "";

    valueRowEl.style.fontSize = "10rem";
    const rect = valueRowEl.getBoundingClientRect();
    if (rect.width > 0 && rect.height > 0) {
      const baseSizePx = parseFloat(getComputedStyle(valueRowEl).fontSize);
      const availW = window.innerWidth * 0.92;
      const availH = window.innerHeight * 0.85;
      const scale = Math.min(availW / rect.width, availH / rect.height);
      valueRowEl.style.fontSize = `${baseSizePx * scale}px`;
    }

    valueEl.innerHTML = prevValueHtml;
    signEl.textContent = prevSignText;
  }

  function run() {
    const PLACEHOLDER_SIGN = CONFIG.expectNegative ? " " : "";
    const PLACEHOLDER_VALUE = "-".repeat(CONFIG.intDigits) +
      (CONFIG.decimals > 0 ? "." + "-".repeat(CONFIG.decimals) : "");
    signEl.textContent = PLACEHOLDER_SIGN;
    valueEl.textContent = PLACEHOLDER_VALUE;

    fitDisplay();
    document.fonts.ready.then(fitDisplay);
    window.addEventListener("resize", () => requestAnimationFrame(fitDisplay));

    function formatValue(v) {
      const scaled = v * CONFIG.factor + CONFIG.offset;
      const absStr = Math.abs(scaled).toFixed(CONFIG.decimals);
      const [intPart, decPart] = absStr.split(".");
      const roundsToZero = parseFloat(absStr) === 0;
      const sign = !CONFIG.expectNegative ? "" : (roundsToZero || scaled >= 0 ? " " : "-");
      return { sign, intPart: intPart.padStart(CONFIG.intDigits, "0"), decPart };
    }

    // Leading zeros in the integer part stay in the DOM (so they still occupy
    // their digit's exact width) but are rendered invisible, always leaving at
    // least one integer digit visible.
    function digitsHtml(intPart, decPart) {
      const chars = intPart.split("");
      const firstSignificant = chars.findIndex((c) => c !== "0");
      const cut = firstSignificant === -1 ? chars.length - 1 : firstSignificant;
      const intHtml = chars
        .map((c, i) => (i < cut ? `<span class="ghost">${c}</span>` : c))
        .join("");
      return decPart !== undefined ? `${intHtml}.${decPart}` : intHtml;
    }

    function markStale() {
      signEl.textContent = PLACEHOLDER_SIGN;
      valueEl.textContent = PLACEHOLDER_VALUE;
      signEl.classList.add("stale");
      valueEl.classList.add("stale");
    }

    function updateValue(v) {
      const { sign, intPart, decPart } = formatValue(v);
      signEl.textContent = sign;
      valueEl.innerHTML = digitsHtml(intPart, decPart);
      signEl.classList.remove("stale");
      valueEl.classList.remove("stale");
      clearTimeout(staleTimer);
      staleTimer = setTimeout(markStale, CONFIG.staleMs);
    }

    function connect() {
      // Match the page's own protocol -- if this webapp is served over
      // https, the SignalK stream must be wss:// or the browser blocks it
      // as mixed content.
      const wsProtocol = window.location.protocol === "https:" ? "wss:" : "ws:";
      const ws = new WebSocket(`${wsProtocol}//${CONFIG.host}/signalk/v1/stream?subscribe=none`);

      ws.onopen = () => {
        dotEl.classList.add("live");
        ws.send(JSON.stringify({
          context: "vessels.self",
          subscribe: [{ path: CONFIG.path, policy: "instant" }],
        }));
      };

      ws.onmessage = (evt) => {
        const data = JSON.parse(evt.data);
        if (!data.updates) return;
        for (const update of data.updates) {
          if (!update.values) continue;
          for (const v of update.values) {
            if (v.path !== CONFIG.path) continue;
            const raw = CONFIG.field ? v.value[CONFIG.field] : v.value;
            if (raw !== null && raw !== undefined) updateValue(raw);
          }
        }
      };

      ws.onclose = () => {
        dotEl.classList.remove("live");
        markStale();
        setTimeout(connect, CONFIG.reconnectMs);
      };

      ws.onerror = () => ws.close();
    }

    connect();
  }
</script>
</body>
</html>
