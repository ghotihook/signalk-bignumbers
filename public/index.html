<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SignalK Instrument Picker</title>
<style>
  html, body {
    margin: 0;
    min-height: 100%;
    background: #111;
    color: #eee;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  body {
    display: flex;
    justify-content: center;
    padding: 3rem 1rem;
  }
  form {
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }
  h1 {
    font-size: 1.3rem;
    margin: 0 0 0.5rem;
  }
  label {
    display: flex;
    flex-direction: column;
    gap: 0.3rem;
    font-size: 0.85rem;
    color: #aaa;
  }
  input, select {
    font-size: 1rem;
    padding: 0.5rem;
    border-radius: 6px;
    border: 1px solid #444;
    background: #1c1c1c;
    color: #eee;
  }
  .advanced {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.75rem;
  }
  .advanced label {
    grid-column: span 1;
  }
  details summary {
    cursor: pointer;
    color: #aaa;
    font-size: 0.85rem;
    margin-bottom: 0.5rem;
  }
  .url-box {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 0.85rem;
    word-break: break-all;
    background: #1c1c1c;
    border: 1px solid #444;
    border-radius: 6px;
    padding: 0.75rem;
    color: #9c9;
  }
  .buttons {
    display: flex;
    gap: 0.75rem;
  }
  button, .btn {
    font-size: 1rem;
    padding: 0.6rem 1rem;
    border-radius: 6px;
    border: none;
    background: #2a6;
    color: #fff;
    cursor: pointer;
    text-decoration: none;
    text-align: center;
    flex: 1;
  }
  button.secondary {
    background: #333;
  }
  .version {
    font-size: 0.75rem;
    color: #666;
    font-weight: normal;
  }
  .status {
    font-size: 0.8rem;
    color: #aaa;
    min-height: 1em;
  }
  .list-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.85rem;
    color: #aaa;
    margin-bottom: 0.5rem;
  }
  .list-header button {
    flex: none;
    padding: 0.3rem 0.6rem;
    font-size: 0.8rem;
  }
  .display-list {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }
  .display-row {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    background: #1c1c1c;
    border: 1px solid #444;
    border-radius: 6px;
    padding: 0.5rem 0.75rem;
  }
  .display-row .code {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    color: #9c9;
    font-weight: bold;
  }
  .display-row .info {
    flex: 1;
    font-size: 0.85rem;
    color: #ccc;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .display-row button {
    flex: none;
    padding: 0.3rem 0.6rem;
    font-size: 0.8rem;
  }
  .list-empty {
    color: #666;
    font-size: 0.85rem;
  }
</style>
</head>
<body>
<form id="form" onsubmit="return false;">
  <h1>SignalK Instrument Picker <span class="version">v0.0.1</span></h1>

  <div>
    <div class="list-header">
      <span>Configured displays</span>
      <button type="button" class="secondary" id="refreshListBtn">Refresh</button>
    </div>
    <div id="displayList" class="display-list"><div class="list-empty">Loading...</div></div>
  </div>

  <label>
    Host:Port
    <input id="host">
  </label>

  <label>
    Instrument
    <select id="preset"></select>
  </label>

  <label>
    Display name
    <input id="name">
  </label>

  <details>
    <summary>Advanced (path / conversion / format)</summary>
    <div class="advanced">
      <label>Path <input id="path"></label>
      <label>Field <input id="field" placeholder="(none)"></label>
      <label>Factor <input id="factor" type="number" step="any"></label>
      <label>Offset <input id="offset" type="number" step="any"></label>
      <label>Unit <input id="unit"></label>
      <label>Layout <input id="layout" placeholder="xx.xx"></label>
      <label>
        Negative
        <select id="neg">
          <option value="false">No</option>
          <option value="true">Yes</option>
        </select>
      </label>
    </div>
  </details>

  <div class="url-box" id="urlBox"></div>

  <div class="buttons">
    <a class="btn" id="openBtn" target="_blank">Open</a>
    <button type="button" class="secondary" id="copyBtn">Copy URL</button>
  </div>

  <label>
    Display ID
    <input id="displayId" placeholder="e.g. helm">
  </label>

  <div class="url-box" id="displayUrlBox"></div>

  <details>
    <summary>SignalK login (required to save)</summary>
    <div class="advanced">
      <label>Username <input id="username"></label>
      <label>Password <input id="password" type="password"></label>
    </div>
    <div class="buttons">
      <button type="button" class="secondary" id="loginBtn">Log in</button>
    </div>
    <div class="status" id="loginStatus"></div>
  </details>

  <div class="buttons">
    <button type="button" id="saveBtn">Save to SignalK</button>
  </div>
  <div class="status" id="saveStatus"></div>
</form>

<script>
  // Standard SignalK paths with recommended conversion + display format.
  // factor/offset convert SignalK's SI-unit value into the shown unit:
  // scaled = raw * factor + offset
  const PRESETS = [
    { name: "AWS", path: "environment.wind.speedApparent", factor: 1.9438444924406, offset: 0, unit: "kt", layout: "xx.xx", neg: false },
    { name: "TWS", path: "environment.wind.speedTrue", factor: 1.9438444924406, offset: 0, unit: "kt", layout: "xx.xx", neg: false },
    { name: "AWA", path: "environment.wind.angleApparent", factor: 57.29577951308232, offset: 0, unit: "°", layout: "xxx", neg: true },
    { name: "TWA", path: "environment.wind.angleTrueWater", factor: 57.29577951308232, offset: 0, unit: "°", layout: "xxx", neg: true },
    { name: "TWD", path: "environment.wind.directionTrue", factor: 57.29577951308232, offset: 0, unit: "°", layout: "xxx", neg: false },
    { name: "SOG", path: "navigation.speedOverGround", factor: 1.9438444924406, offset: 0, unit: "kt", layout: "xx.xx", neg: false },
    { name: "STW", path: "navigation.speedThroughWater", factor: 1.9438444924406, offset: 0, unit: "kt", layout: "xx.xx", neg: false },
    { name: "COG", path: "navigation.courseOverGroundTrue", factor: 57.29577951308232, offset: 0, unit: "°", layout: "xxx", neg: false },
    { name: "HDG", path: "navigation.headingTrue", factor: 57.29577951308232, offset: 0, unit: "°", layout: "xxx", neg: false },
    { name: "HDG", path: "navigation.headingMagnetic", factor: 57.29577951308232, offset: 0, unit: "°", layout: "xxx", neg: false },
    { name: "Roll", path: "navigation.attitude", field: "roll", factor: 57.29577951308232, offset: 0, unit: "°", layout: "xx", neg: true },
    { name: "Trim", path: "navigation.attitude", field: "pitch", factor: 57.29577951308232, offset: 0, unit: "°", layout: "xx", neg: true },
    { name: "Yaw", path: "navigation.attitude", field: "yaw", factor: 57.29577951308232, offset: 0, unit: "°", layout: "xxx", neg: false },
    { name: "Rudder", path: "steering.rudderAngle", factor: 57.29577951308232, offset: 0, unit: "°", layout: "xx", neg: true },
    { name: "Depth", path: "environment.depth.belowTransducer", factor: 1, offset: 0, unit: "m", layout: "xx.x", neg: false },
    { name: "DBK", path: "environment.depth.belowKeel", factor: 1, offset: 0, unit: "m", layout: "xx.x", neg: false },
    { name: "DBS", path: "environment.depth.belowSurface", factor: 1, offset: 0, unit: "m", layout: "xx.x", neg: false },
    { name: "SEA", path: "environment.water.temperature", factor: 1, offset: -273.15, unit: "°C", layout: "xx.x", neg: true },
    { name: "AIR", path: "environment.outside.temperature", factor: 1, offset: -273.15, unit: "°C", layout: "xx.x", neg: true },
    { name: "TRIP", path: "navigation.trip.log", factor: 0.0005399568034557235, offset: 0, unit: "nm", layout: "xxx.x", neg: false },
    { name: "LOG", path: "navigation.log", factor: 0.0005399568034557235, offset: 0, unit: "nm", layout: "xxxxx.x", neg: false },
    { name: "SATS", path: "navigation.gnss.satellites", factor: 1, offset: 0, unit: "", layout: "xx", neg: false },
    { name: "BATT", path: "electrical.batteries.0.voltage", factor: 1, offset: 0, unit: "V", layout: "xx.x", neg: false },
  ];

  const el = (id) => document.getElementById(id);
  const presetSelect = el("preset");

  PRESETS.forEach((p, i) => {
    const opt = document.createElement("option");
    opt.value = i;
    opt.textContent = p.field ? `${p.path} -> ${p.field}` : p.path;
    presetSelect.appendChild(opt);
  });

  function applyPreset(p) {
    el("name").value = p.name;
    el("path").value = p.path;
    el("field").value = p.field || "";
    el("factor").value = p.factor;
    el("offset").value = p.offset;
    el("unit").value = p.unit;
    el("layout").value = p.layout;
    el("neg").value = String(p.neg);
    updateUrl();
  }

  // Directory this page lives in, so the generated link works whether it's
  // opened straight from disk or hosted by SignalK under /<webapp-name>/.
  function instrumentBaseUrl() {
    const dir = window.location.pathname.replace(/[^/]*$/, "");
    return `${window.location.origin}${dir}instrument.html`;
  }

  function updateUrl() {
    const params = new URLSearchParams();
    params.set("host", el("host").value.trim());
    params.set("path", el("path").value.trim());
    if (el("field").value.trim()) params.set("field", el("field").value.trim());
    params.set("name", el("name").value.trim());
    params.set("layout", el("layout").value.trim() || "x");
    params.set("neg", el("neg").value);
    if (el("unit").value.trim()) params.set("unit", el("unit").value.trim());
    if (el("factor").value && el("factor").value !== "1") params.set("factor", el("factor").value);
    if (el("offset").value && el("offset").value !== "0") params.set("offset", el("offset").value);

    const url = `${instrumentBaseUrl()}?${params.toString()}`;
    el("urlBox").textContent = url;
    el("openBtn").href = url;
    return url;
  }

  presetSelect.addEventListener("change", () => applyPreset(PRESETS[presetSelect.value]));
  form.addEventListener("input", () => { updateUrl(); updateDisplayUrl(); });

  el("copyBtn").addEventListener("click", () => {
    navigator.clipboard.writeText(updateUrl());
  });

  // --- Dumb display support: save this instrument config to SignalK's
  // applicationData store, keyed by display id, so a kiosk pointed at
  // ?display=<id> never needs its own config touched again. Reads are
  // unauthenticated; SignalK requires a login for writes.
  const TOKEN_KEY = "sk_token";

  function signalkOrigin() {
    return `${window.location.protocol}//${el("host").value.trim()}`;
  }

  function applicationDataUrl() {
    return `${signalkOrigin()}/signalk/v1/applicationData/global/signalk-bignumbers/1`;
  }

  function updateDisplayUrl() {
    const id = el("displayId").value.trim();
    el("displayUrlBox").textContent = id
      ? `${instrumentBaseUrl()}?display=${encodeURIComponent(id)}`
      : "(set a Display ID to see its URL)";
  }

  function instrumentConfig() {
    const cfg = {
      path: el("path").value.trim(),
      name: el("name").value.trim(),
      layout: el("layout").value.trim() || "x",
      neg: el("neg").value === "true",
    };
    if (el("field").value.trim()) cfg.field = el("field").value.trim();
    if (el("unit").value.trim()) cfg.unit = el("unit").value.trim();
    if (el("factor").value && el("factor").value !== "1") cfg.factor = parseFloat(el("factor").value);
    if (el("offset").value && el("offset").value !== "0") cfg.offset = parseFloat(el("offset").value);
    return cfg;
  }

  el("loginBtn").addEventListener("click", async () => {
    el("loginStatus").textContent = "Logging in...";
    try {
      const res = await fetch(`${signalkOrigin()}/signalk/v1/auth/login`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username: el("username").value, password: el("password").value }),
      });
      const data = await res.json();
      if (!res.ok || !data.token) throw new Error(data.message || `HTTP ${res.status}`);
      localStorage.setItem(TOKEN_KEY, data.token);
      el("password").value = "";
      el("loginStatus").textContent = "Logged in.";
    } catch (err) {
      el("loginStatus").textContent = `Login failed: ${err.message}`;
    }
  });

  el("saveBtn").addEventListener("click", async () => {
    const displayId = el("displayId").value.trim();
    if (!displayId) { el("saveStatus").textContent = "Set a Display ID first."; return; }
    const token = localStorage.getItem(TOKEN_KEY);
    if (!token) { el("saveStatus").textContent = "Log in first."; return; }

    el("saveStatus").textContent = "Saving...";
    try {
      const current = await fetch(applicationDataUrl()).then((r) => (r.ok ? r.json() : {}));
      current[displayId] = instrumentConfig();
      const res = await fetch(applicationDataUrl(), {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
        body: JSON.stringify(current),
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      el("saveStatus").textContent = `Saved "${displayId}".`;
      loadDisplayList();
    } catch (err) {
      el("saveStatus").textContent = `Save failed: ${err.message}`;
    }
  });

  // --- Configured displays list: view/edit/delete every code already
  // saved in SignalK, reusing the same applicationData document and the
  // same login token as the save flow above.
  async function loadDisplayList() {
    const listEl = el("displayList");
    try {
      const res = await fetch(applicationDataUrl());
      renderDisplayList(res.ok ? await res.json() : {});
    } catch (err) {
      listEl.innerHTML = `<div class="list-empty">Couldn't load list: ${err.message}</div>`;
    }
  }

  function renderDisplayList(data) {
    const listEl = el("displayList");
    const codes = Object.keys(data).sort();
    if (codes.length === 0) {
      listEl.innerHTML = '<div class="list-empty">No displays configured yet.</div>';
      return;
    }
    listEl.innerHTML = "";
    codes.forEach((code) => {
      const cfg = data[code];
      const row = document.createElement("div");
      row.className = "display-row";
      const info = `${cfg.name || "(no name)"} — ${cfg.path || ""}${cfg.field ? "." + cfg.field : ""}`;
      row.innerHTML = `
        <span class="code">${code}</span>
        <span class="info">${info}</span>
        <button type="button" class="secondary">Edit</button>
        <button type="button" class="secondary">Delete</button>
      `;
      const [editBtn, deleteBtn] = row.querySelectorAll("button");
      editBtn.addEventListener("click", () => loadIntoForm(code, cfg));
      deleteBtn.addEventListener("click", () => deleteDisplay(code));
      listEl.appendChild(row);
    });
  }

  function loadIntoForm(code, cfg) {
    el("displayId").value = code;
    el("name").value = cfg.name || "";
    el("path").value = cfg.path || "";
    el("field").value = cfg.field || "";
    el("factor").value = cfg.factor !== undefined ? cfg.factor : 1;
    el("offset").value = cfg.offset !== undefined ? cfg.offset : 0;
    el("unit").value = cfg.unit || "";
    el("layout").value = cfg.layout || "x";
    el("neg").value = String(!!cfg.neg);
    updateUrl();
    updateDisplayUrl();
  }

  async function deleteDisplay(code) {
    const token = localStorage.getItem(TOKEN_KEY);
    if (!token) { el("saveStatus").textContent = "Log in first."; return; }
    if (!confirm(`Delete display "${code}"?`)) return;

    el("saveStatus").textContent = "Deleting...";
    try {
      const current = await fetch(applicationDataUrl()).then((r) => (r.ok ? r.json() : {}));
      delete current[code];
      const res = await fetch(applicationDataUrl(), {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
        body: JSON.stringify(current),
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      el("saveStatus").textContent = `Deleted "${code}".`;
      loadDisplayList();
    } catch (err) {
      el("saveStatus").textContent = `Delete failed: ${err.message}`;
    }
  }

  el("refreshListBtn").addEventListener("click", loadDisplayList);

  el("host").value = window.location.host || "hl.local:3000";
  applyPreset(PRESETS[0]);
  updateDisplayUrl();
  loadDisplayList();
</script>
</body>
</html>
